setupVersion: 2
statusLine:
  preset: custom
  transparent: true
  compactThinkingLevel: false
  separator: slash
  leftSegments:
    - session_name
    - model
    - mode
  rightSegments:
    - cost
    - context_pct
  showHookStatus: false
  sessionAccent: true
  contextLine: "off"
defaultThinkingLevel: medium
advisor:
  enabled: false
modelRoles:
  task: openai-codex/gpt-6-luna:max
  smol: openai-codex/gpt-6-luna:low
  tiny: openai-codex/gpt-6-luna:low
  advisor: anthropic/claude-opus-5-5:medium
  plan: openai-codex/gpt-6-sol:medium
theme:
  dark: dark
hideThinkingBlock: true
proseOnlyThinking: false
omitThinking: true
providers:
  anthropic:
    serverSideFallback: false
steeringMode: all
tools:
  approvalMode: yolo
autoResume: true
startup:
  quiet: true
  showSplash: false
contextPromotion:
  enabled: false
branchSummary:
  enabled: false
memory:
  backend: local
autolearn:
  enabled: false
  autoContinue: true
edit:
  mode: hashline
plan:
  defaultOnStartup: false
followUpMode: all
loop:
  mode: prompt
doubleEscapeAction: none
treeFilterMode: default
paste:
  largeMenuThreshold: 100
input:
  inline_paste_threshold: 10
  file_paste_threshold: 100
  auto_file_paste_dir: /tmp/omp_pastes
task:
  eager: default
dev:
  autoqaConsent: denied
eval:
  py: false
  js: false
composer:
  shape: box
display:
  smoothStreaming: false
  showTokenUsage: true
  cacheMissMarker: true
codexResets:
  autoRedeem: "no"
enabledModels:
  - anthropic/claude-sonnet-5:low
  - anthropic/claude-sonnet-5:medium
  - anthropic/claude-sonnet-5:high
  - anthropic/claude-opus-5-5:low
  - anthropic/claude-opus-5-5:medium
  - anthropic/claude-opus-5-5:high
  - openai-codex/gpt-6-luna:xhigh
  - openai-codex/gpt-6-luna:max
  - openai-codex/gpt-6-sol:low
  - openai-codex/gpt-6-sol:medium
  - openai-codex/gpt-6-sol:high